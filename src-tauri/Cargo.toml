[package]
name = "app"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MusicMaxxer"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the player stream a take from the library folder
# instead of reading 40 MB of wav into the webview. Scoped in tauri.conf.json
# and capabilities/default.json to ~/MiniMaxMusic.
tauri = { version = "2", features = ["protocol-asset"] }
minimax = { path = "../crates/minimax" }
studio = { path = "../crates/studio" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
